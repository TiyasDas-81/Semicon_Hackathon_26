# Configuration for Semicon Image Restoration

seed: 42
scale: 4  # Super-resolution scale factor

dataset:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  num_samples_train: 120
  num_samples_val: 30
  num_samples_test: 30
  image_size: 256
  patch_size: 64
  augment: true

degradation:
  # Random ranges for various degradations
  blur_sigma_min: 0.5
  blur_sigma_max: 2.0
  poisson_noise_scale_min: 0.5
  poisson_noise_scale_max: 2.0
  gaussian_noise_sigma_min: 0.005
  gaussian_noise_sigma_max: 0.03
  jpeg_quality_min: 40
  jpeg_quality_max: 90
  contrast_min: 0.7
  contrast_max: 1.3
  brightness_min: -0.15
  brightness_max: 0.15

model:
  cnn:
    num_res_blocks: 6
    num_channels: 32
  transformer:
    embed_dim: 48
    depths: [4, 4]
    num_heads: [4, 4]
    window_size: 8
    mlp_ratio: 2.0

train:
  batch_size: 16
  learning_rate: 0.0005
  epochs: 15
  use_amp: true
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  val_interval: 2
  early_stopping_patience: 5
