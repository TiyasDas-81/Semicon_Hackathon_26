# Configuration for Semicon Image Restoration

seed: 42
scale: 4  # Super-resolution scale factor

dataset:
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  num_samples_train: 500
  num_samples_val: 50
  num_samples_test: 50
  image_size: 256
  patch_size: 64
  augment: true

degradation:
  # Random ranges for various degradations (tuned to avoid overly destroyed inputs)
  blur_sigma_min: 0.4
  blur_sigma_max: 1.5
  poisson_noise_scale_min: 1.0
  poisson_noise_scale_max: 2.5
  gaussian_noise_sigma_min: 0.003
  gaussian_noise_sigma_max: 0.02
  jpeg_quality_min: 55
  jpeg_quality_max: 95
  contrast_min: 0.8
  contrast_max: 1.2
  brightness_min: -0.10
  brightness_max: 0.10

model:
  cnn:
    num_res_blocks: 8
    num_channels: 48
  transformer:
    embed_dim: 48
    depths: [4, 4]
    num_heads: [4, 4]
    window_size: 8
    mlp_ratio: 2.0

train:
  batch_size: 8
  learning_rate: 0.0003
  epochs: 50
  use_amp: true
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  val_interval: 2
  early_stopping_patience: 15
